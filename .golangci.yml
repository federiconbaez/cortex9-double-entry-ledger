version: "2"
linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gosec
    - revive
  settings:
    depguard:
      rules:
        domain-pure:
          files:
            - "**/internal/domain/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
          deny:
            - pkg: os
              desc: domain must not do I/O
            - pkg: io
              desc: domain must not do I/O
            - pkg: net
              desc: no network in the domain
            - pkg: encoding/json
              desc: serialization belongs to the application layer
            - pkg: github.com/federiconbaez/cortex9-double-entry-ledger/internal
              desc: domain must not depend on other layers
        app-no-adapters:
          files:
            - "**/internal/app/*.go"
            - "!$test"
          deny:
            - pkg: github.com/federiconbaez/cortex9-double-entry-ledger/internal/adapters
              desc: application depends on ports, not adapters
            - pkg: os
              desc: application does no I/O directly
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003"]
    revive:
      rules:
        - name: exported
  exclusions:
    presets:
      - std-error-handling
formatters:
  enable:
    - gofmt
