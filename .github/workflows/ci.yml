name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: golangci-lint (incl. depguard dependency rule)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: domain coverage
        run: |
          go test -count=1 -coverprofile=domain.out ./internal/domain/
          go tool cover -func=domain.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: fuzz JSONL decoder (short)
        run: go test -run='^$' -fuzz=FuzzScan -fuzztime=30s ./internal/adapters/jsonlstore/
      - name: fuzz event codec (short)
        run: go test -run='^$' -fuzz=FuzzDecodeEvent -fuzztime=30s ./internal/app/
      - name: demo
        run: go run ./cmd/ledger-demo -file "$RUNNER_TEMP/demo.jsonl"
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --no-banner --redact
